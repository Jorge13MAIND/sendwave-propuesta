<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="40%" stop-color="#059669"/>
      <stop offset="70%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0.3" y1="0.3" x2="0.7" y2="0.7">
      <stop offset="40%" stop-color="white" stop-opacity="0"/>
      <stop offset="48%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.13"/>
      <stop offset="52%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="80" ry="80"/>
    </clipPath>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="rgba(5,150,105,0.25)"/>
      <feDropShadow dx="0" dy="12" stdDeviation="32" flood-color="rgba(6,95,70,0.3)"/>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <rect width="512" height="512" rx="80" ry="80" fill="url(#bg)" filter="url(#glow)"/>
  
  <!-- Base -->
  <rect width="512" height="512" rx="80" ry="80" fill="url(#bg)"/>
  
  <!-- Inner border highlight -->
  <rect x="1" y="1" width="510" height="510" rx="79" ry="79" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
  
  <!-- Static shimmer -->
  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="512" height="512" fill="url(#shimmer)"/>
  </g>
  
  <!-- Glass edge top -->
  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="512" height="256" fill="url(#glass)"/>
  </g>
  
  <!-- T letter -->
  <text x="256" y="340" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="280" fill="white" letter-spacing="-8" filter="url(#textShadow)">T</text>
</svg>
